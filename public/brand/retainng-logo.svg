<svg viewBox="0 0 600 600" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2e22" />
      <stop offset="60%" stop-color="#06120e" />
      <stop offset="100%" stop-color="#030707" />
    </radialGradient>

    <linearGradient id="neonEmerald" x1="100" y1="120" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cyanTeal" x1="220" y1="100" x2="500" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#10B981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Medallion -->
  <circle cx="300" cy="300" r="280" fill="url(#bgAmbient)" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.35" filter="url(#shadow)" />
  <circle cx="300" cy="300" r="255" stroke="#34D399" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="10 8" />

  <!-- Master "R" Retention Loop -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <path d="M 185 140 L 245 140 C 250 140 254 144 254 149 L 254 445 C 254 453 247 460 239 460 L 190 460 C 182 460 176 453 176 445 L 176 149 C 176 144 180 140 185 140 Z" fill="url(#neonEmerald)" />
    <!-- White Spine Highlight -->
    <path d="M 186 148 L 194 148 L 194 452 L 186 452 Z" fill="#FFFFFF" fill-opacity="0.5" />

    <!-- Upper Retention Loop -->
    <path d="M 235 140 L 345 140 C 410 140 455 178 455 242 C 455 305 408 344 340 344 L 235 344 Z" fill="url(#cyanTeal)" />
    <path d="M 254 200 L 335 200 C 368 200 392 216 392 242 C 392 268 368 284 335 284 L 254 284 Z" fill="#040C08" stroke="#34D399" stroke-width="2" stroke-opacity="0.4" />

    <!-- Forward Momentum Kick Leg -->
    <path d="M 310 325 L 380 325 C 395 325 408 333 416 345 L 472 436 C 479 448 471 460 457 460 L 398 460 C 388 460 378 454 372 444 L 326 372 C 320 363 313 358 300 358 L 254 358 L 254 325 Z" fill="url(#neonEmerald)" />

    <!-- Clinical Health Badge -->
    <circle cx="445" cy="180" r="26" fill="#061A12" stroke="#34D399" stroke-width="3" />
    <path d="M 445 168 L 445 192 M 433 180 L 457 180" stroke="#34D399" stroke-width="4.5" stroke-linecap="round" />

    <!-- Active Pulse Node -->
    <circle cx="465" cy="450" r="9" fill="#34D399" />
    <circle cx="465" cy="450" r="18" fill="#10B981" fill-opacity="0.3" />
  </g>
</svg>
